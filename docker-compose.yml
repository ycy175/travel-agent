services:
  travel-agent:
    build: .
    image: travel-agent:local
    container_name: travel-agent
    ports:
      - "8080:8080"
    environment:
      # 必填：宿主机需先设置 DEEPSEEK_API_KEY
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      # 生产环境务必替换
      TRAVEL_TOKEN_SECRET: ${TRAVEL_TOKEN_SECRET:-dev-only-secret-change-me-32bytes}
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/travel_db"
    volumes:
      - travel-data:/app/data
      - agent-workspace:/app/.agentscope
    restart: unless-stopped

volumes:
  travel-data:
  agent-workspace:
